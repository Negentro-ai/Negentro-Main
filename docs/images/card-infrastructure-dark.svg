<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 169" width="100%" height="100%">
  <rect width="400" height="169" fill="#161426"/>
  <!-- Connecting vertical lines -->
  <line x1="200" y1="10" x2="200" y2="20" stroke="#4b5563" stroke-width="1.2"/>
  <line x1="200" y1="46" x2="200" y2="58" stroke="#4b5563" stroke-width="1.2"/>
  <line x1="200" y1="86" x2="200" y2="98" stroke="#4b5563" stroke-width="1.2"/>
  <line x1="200" y1="124" x2="200" y2="136" stroke="#4b5563" stroke-width="1.2"/>

  <!-- Node 1: Application -->
  <g filter="drop-shadow(0px 2px 6px rgba(0, 0, 0, 0.3))">
    <rect x="154" y="20" width="92" height="26" rx="6" fill="#1f1c33" stroke="#353052" stroke-width="1"/>
    <text x="200" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#f1f5f9" text-anchor="middle">Application</text>
  </g>

  <!-- Node 2: VPC Peering (Highlighted Purple) -->
  <g filter="drop-shadow(0px 3px 12px rgba(118, 93, 251, 0.4))">
    <rect x="144" y="58" width="112" height="28" rx="7" fill="#241e42" stroke="#765DFB" stroke-width="1.5"/>
    <text x="200" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c4b5fd" text-anchor="middle">VPC Peering</text>
  </g>

  <!-- Node 3: Negentro Core -->
  <g filter="drop-shadow(0px 2px 6px rgba(0, 0, 0, 0.3))">
    <rect x="144" y="98" width="112" height="26" rx="6" fill="#1f1c33" stroke="#353052" stroke-width="1"/>
    <text x="200" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#f1f5f9" text-anchor="middle">Negentro Core</text>
  </g>

  <!-- Node 4: Your Secure DB -->
  <g filter="drop-shadow(0px 2px 6px rgba(0, 0, 0, 0.3))">
    <rect x="140" y="136" width="120" height="26" rx="6" fill="#1f1c33" stroke="#353052" stroke-width="1"/>
    <text x="200" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#f1f5f9" text-anchor="middle">Your Secure DB</text>
  </g>
</svg>